apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving-api
  namespace: picpay-ml
  labels:
    name: model-serving-api
spec:
  replicas: 2
  selector:
    matchLabels:
      name: model-serving-api
  template:
    metadata:
      labels:
        name: model-serving-api
    spec:
      containers:
        - name: model-serving-api
          image: picpay-model-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: model-serving-api-config
            - secretRef:
                name: mongodb-auth
          livenessProbe:
            httpGet:
              path: /health-check/
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health-check/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "300m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"