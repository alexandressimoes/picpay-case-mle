apiVersion: v1
kind: ConfigMap
metadata:
  name: model-serving-api-config
  namespace: picpay-ml
data:
  APP_ENV: "kubernetes"
  LOG_LEVEL: "INFO"
  API_PORT: "80"
  # Fase 1: variaveis preparadas para quando a API usar MongoDB.
  METADATA_BACKEND: "mongodb"
  MONGODB_HOST: "mongodb"
  MONGODB_PORT: "27017"
  MONGODB_DB: "picpay_metadata"
  MONGODB_MODELS_COLLECTION: "model_registry"
  MONGODB_TRANSACTIONS_COLLECTION: "transactions_registry"